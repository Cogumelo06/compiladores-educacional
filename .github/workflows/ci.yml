name: Validacao - Trabalho 3

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes unitarios e de interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar scanner, API e regressoes
        run: npm --prefix backend test
      - name: Testar interface, exibicao lexical e regressoes
        run: npm --prefix frontend test

  docker:
    name: Instalacao limpa e integracao via Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagens e iniciar servicos
        run: docker compose up --build --force-recreate -d
      - name: Verificar scanner integrado, tokens e erros lexicos
        run: sh scripts/smoke-test.sh
      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar os servicos
        if: always()
        run: docker compose down --remove-orphans
