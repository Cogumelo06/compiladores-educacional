name: Validacao - Etapa 1

on:
  push:
  pull_request:

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes da API
        run: npm --prefix backend test

  docker:
    name: Instalacao limpa com Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar as imagens e subir os dois servicos
        run: docker compose up --build --force-recreate -d
      - name: Conferir frontend, proxy e backend
        run: sh scripts/smoke-test.sh
      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar os servicos
        if: always()
        run: docker compose down --remove-orphans
